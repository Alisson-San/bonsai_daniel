<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1911" />
    <meta name="description" content="Bonsaísta há 15 anos. Bonsai e pré-bonsai da coleção de Daniel Bourscheid à venda, com a lista atualizada toda semana." />
    <!-- Link previews (WhatsApp, Instagram, Facebook). Crawlers need absolute URLs: update the domain if the site moves. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Bonsai Daniel Bourscheid" />
    <meta property="og:title" content="Bonsai Daniel Bourscheid" />
    <meta property="og:description" content="Bonsaísta há 15 anos. Bonsai e pré-bonsai da coleção à venda, com a lista atualizada toda semana." />
    <meta property="og:url" content="https://bonsaidaniel.vercel.app/" />
    <meta property="og:image" content="https://bonsaidaniel.vercel.app/images/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Bonsai Daniel Bourscheid: bordo japonês vermelho num arco dourado sobre a placa com o nome." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try { const saved = localStorage.getItem('bourscheid-theme'); const theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = theme; document.documentElement.style.colorScheme = theme; const poster = document.createElement('link'); poster.rel = 'preload'; poster.as = 'image'; poster.href = '/images/hero-poster-' + theme + (matchMedia('(max-width: 800px)').matches ? '' : '-large') + '.webp'; document.head.appendChild(poster); } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <script>
      // ?debug3d: a panel that collects errors from the very start, so a script that fails to load or run on a phone
      // still shows why (the 3D hero adds its own steps to the same panel).
      if (/[?&]debug3d/.test(location.search)) {
        const panel = () => document.querySelector('.debug-3d') || document.body && document.body.appendChild(Object.assign(document.createElement('pre'), { className: 'debug-3d', textContent: 'Diagnóstico do 3D\n' + navigator.userAgent }));
        const add = text => { const p = panel(); if (p) p.textContent += '\n' + (performance.now() / 1000).toFixed(1) + ' s · ' + text; else addEventListener('DOMContentLoaded', () => add(text)); };
        addEventListener('error', event => add('erro: ' + (event.message || (event.target && (event.target.src || event.target.href)) || 'recurso não carregou')), true);
        addEventListener('unhandledrejection', event => add('erro: ' + (event.reason && event.reason.message || event.reason)));
        addEventListener('DOMContentLoaded', () => add('página carregada; WebGL ' + (document.createElement('canvas').getContext('webgl2') ? '2 disponível' : document.createElement('canvas').getContext('webgl') ? '1 disponível' : 'indisponível')));
        addEventListener('load', () => setTimeout(() => { if (!document.querySelector('.hero-spatial.is-ready, .hero-spatial.is-failed')) add('o app ainda não iniciou o 3D (o JavaScript do site pode não estar rodando)'); }, 4000));
      }
    </script>
    <title>Bonsai Daniel Bourscheid</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Fonts load without blocking the first paint; text shows in the fallback font and swaps in. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;450;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;450;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
