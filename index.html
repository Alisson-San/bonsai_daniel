<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1911" />
    <meta name="description" content="Bonsaísta há 15 anos. Bonsai e pré-bonsai da coleção de Daniel Bourscheid à venda, com a lista atualizada toda semana." />
    <!-- Link previews (WhatsApp, Instagram, Facebook). Crawlers need absolute URLs: update the domain if the site moves. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Bonsai Daniel Bourscheid" />
    <meta property="og:title" content="Bonsai Daniel Bourscheid" />
    <meta property="og:description" content="Bonsaísta há 15 anos. Bonsai e pré-bonsai da coleção à venda, com a lista atualizada toda semana." />
    <meta property="og:url" content="https://bonsaidaniel.vercel.app/" />
    <meta property="og:image" content="https://bonsaidaniel.vercel.app/images/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Bonsai Daniel Bourscheid: bordo japonês vermelho num arco dourado sobre a placa com o nome." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try { const saved = localStorage.getItem('bourscheid-theme'); const theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = theme; document.documentElement.style.colorScheme = theme; if (location.pathname === '/') { const poster = document.createElement('link'); poster.rel = 'preload'; poster.as = 'image'; poster.href = '/images/hero-poster-' + theme + (matchMedia('(max-width: 800px)').matches ? '' : '-large') + '.webp'; document.head.appendChild(poster); } } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <title>Bonsai Daniel Bourscheid</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Fonts load without blocking the first paint; text shows in the fallback font and swaps in. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;450;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <!-- Seal kanji (SectionMark): only these characters are downloaded. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&text=%E7%9B%86%E6%A0%BD%E5%8C%A0%E7%B8%81%E5%AE%B6%E8%AA%89%E4%BC%9D%E8%A8%98%E8%AA%9E%E6%AD%A9%E9%81%93%E5%A3%B0%E8%94%B5&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&text=%E7%9B%86%E6%A0%BD%E5%8C%A0%E7%B8%81%E5%AE%B6%E8%AA%89%E4%BC%9D%E8%A8%98%E8%AA%9E%E6%AD%A9%E9%81%93%E5%A3%B0%E8%94%B5&display=swap" /><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;450;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
